name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip src.zip and tools.zip
        run: |
          if [ -f src.zip ]; then
            if unzip -l src.zip | awk 'NR>3{print $4}' | grep -q '^src/'; then unzip -oq src.zip; else unzip -oq src.zip -d src; fi
            git rm -q src.zip
          fi
          if [ -f tools.zip ]; then
            if unzip -l tools.zip | awk 'NR>3{print $4}' | grep -q '^tools/'; then unzip -oq tools.zip; else unzip -oq tools.zip -d tools; fi
            git rm -q tools.zip
          fi
          printf '.gradle/\nbuild/\nrun/\nout/\n.idea/\n*.iml\n.classpath\n.project\n.settings/\nbin/\neclipse/\n__pycache__/\n' > .gitignore
          test -d src/main || { echo "src/main not found"; find . -maxdepth 3 -not -path './.git/*'; exit 1; }
          git config user.name "github-actions
